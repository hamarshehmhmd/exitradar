[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exitradar"
version = "0.1.0"
description = "Find the dependencies whose upstream was archived, deprecated, relicensed, acquired or shut down (npm, PyPI, Go, Cargo, gems, GitHub Actions, images, Helm, Terraform, runtimes, hosted services), with deadlines and what to move to."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Hamarsheh" }]
keywords = ["dependencies", "supply-chain", "archived", "deprecated", "end-of-life", "github-actions", "docker", "helm", "sbom"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/hamarshehmhmd/exitradar"
Issues = "https://github.com/hamarshehmhmd/exitradar/issues"

[project.scripts]
exitradar = "exitradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exitradar = ["feed.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
